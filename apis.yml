aid: seekops
name: SeekOps
description: 'SeekOps Inc. is an Austin, Texas emissions-measurement company that detects
  and quantifies methane and carbon dioxide from industrial facilities using drone-mounted
  laser spectroscopy. Its SeekIR sensor suite applies tunable diode laser absorption
  spectroscopy (TDLAS) originally developed at NASA''s Jet Propulsion Laboratory to
  search for methane on Mars, hardened for terrestrial energy operations. SeekOps sells
  measurement as a service — Leak Detection and Quantification (LDAQ) surveys flown over
  upstream and midstream oil and gas sites, offshore platforms, landfills, biogas digesters
  and renewable natural gas facilities — and delivers the results through two software
  surfaces: Celsius, a cloud analytics and reconciliation-reporting dashboard, and FASTR,
  a real-time telemetry view. Founded in 2017, the company has surveyed facilities across
  six continents and is backed by Equinor Ventures and OGCI Climate Investments. Its
  software is customer-only: both Celsius and FASTR sit behind authentication and SeekOps
  publishes no public developer program, API documentation or machine-readable contract.'
